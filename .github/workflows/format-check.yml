name: Check Source Formatting

on:
  pull_request:

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run clang-format
        uses: RafikFarhad/clang-format-github-action@v6
        with:
          sources: "**/*.c,**/*.h"
          style: "file"
